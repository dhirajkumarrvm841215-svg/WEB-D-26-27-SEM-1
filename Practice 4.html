<html>
    <head>
        <title>Hotel Room Booking Form</title>
    </head>
    <body border="1" style="border: 5px solid rgb(14, 10, 11); padding: 20px; width: 400px; margin: auto;">
        <center>
            <h1 align="center">Hotel Room Booking Form</h1>
            <form>
                <label for="name">Full Name:</label>
                <input type="text" name="name" id="name" placeholder="" required>
                <br><br>
                <label for="email">Email:</label>
                <input type="email" name="email" id="email" placeholder="" required>
                <br><br>
                <label for="phone">Phone:</label>
                <input type="tel" name="phone" id="phone" placeholder="" required>
                <br><br>
                <label for="checkin">Check-in Date:</label>
                <input type="date" name="checkin" id="checkin" required>
                <br><br>
                <label for="checkout">Check-out Date:</label>
                <input type="date" name="checkout" id="checkout" required>
                <br><br>
                <label for="roomtype">Room Type:</label>
                <select name="roomtype" id="roomtype" required>
                    <option value="Single Room"></option>
                    <option value="single">Single Room</option>
                    <option value="double">Double Room</option>
                    <option value="triple">Triple Room</option>
                </select>
                <br><br>
                <label for="guests">Number of Guests:</label>
                <input type="number" name="guests" id="guests" min="1" max="100" required>
                <br><br>
                <label for="requests">Special Requests:</label>
                <br>
                <textarea id="requests" name="requests" rows="4" cols="40"></textarea>
                <br><br>
                <input type="submit" value="Book Now">
                <input type="reset" value="Reset Form">
            </form>
        </center>
        <h3>Name:Dhiraj Kumar</h3>
        <h3>Adm.No.: 2026b02310073</h3>
        <h3> Branch:ELCE 1</h3>
    </body>
</html>
