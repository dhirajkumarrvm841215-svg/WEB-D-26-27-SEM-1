<html>
    <head>
        <title>Student Registration Form</title>
    </head>
    <body >
        
            <h1 align="center">Student Registration Form</h1>
            <hr>
             <form>
                <label for="name">Full Name:</label>
                <input type="text" name="name" id="name" placeholder="Enter your full name" required>
                <br><br>
                <label for="email">Email:</label>
                <input type="email" name="email" id="email" placeholder="Enter valid email address" required>
                <br><br>
                <label for="Pass">Password:</label>
                <input type="password" name="Pass" id="Pass" placeholder="Enter password" required>
                <br><br>
                <label for="gender">Gender:</label>
                <input type="radio" name="gender" value="Male"> Male
                <input type="radio" name="gender" value="Female"> Female
                <input type="radio" name="gender" value="Other"> Others
                <br><br>
                <label for="course">Course:</label>
                <select id="course" name="--Course--">
                    <option>--Select Course--</option>
                    <option>Jee Main</option>
                    <option>Jee Advance</option>
                    <option >Neet</option>
                    </select>
                <br><br>
                <label for="contact">Contact No.:</label>
                <input type="tel" name="contact" id="contact" placeholder="Enter phone number" required>
                <br><br>
                <label for="Address">Address:</label>
                <br>
                <textarea id="requests" name="Enter your address" rows="3" cols="40"></textarea>
                <br><br>
                <input type="submit" value="Register">
                <input type="reset" value="Clear">
                <hr>
                <p align="center"> &copy; 2025 Student Registration Portal</p>
            </form>

        </body>
</html>
